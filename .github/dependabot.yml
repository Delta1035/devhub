version: 2
updates:
  # Workflows pin actions to commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']

  # Covers every workspace package through the root pnpm lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor and patch updates land in one PR; each major update gets its own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # plugin-react 6 needs Vite 8; electron-vite 5 only supports Vite <=7.
      # Upgrade all three together once electron-vite 6 is stable.
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'electron-vite'
        update-types: ['version-update:semver-major']
