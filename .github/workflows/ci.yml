name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; every commit on main still gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: pnpm e2e
      - name: E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e
      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.os }}
          path: apps/desktop/test-results
          if-no-files-found: ignore

  # Packages the app without an installer so problems with native modules
  # (node-pty, npmRebuild: false) show up before a release build.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @devhub/desktop build:unpack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify node-pty native module is unpacked
        shell: bash
        run: |
          # Windows ships prebuilds; Linux has none, so node-pty is compiled into build/Release.
          case "$RUNNER_OS" in
            Windows) native=apps/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules/node-pty/prebuilds/win32-x64/pty.node ;;
            Linux) native=apps/desktop/dist/linux-unpacked/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node ;;
          esac
          if [ ! -f "$native" ]; then
            echo "::error::node-pty native module missing from package: $native"
            exit 1
          fi
          echo "found $native"
