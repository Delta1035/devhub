appId: com.devhub.desktop
productName: DevHub
directories:
  buildResources: build
files:
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.e2e.json}'
  - '!{e2e,test-results,playwright-report}/**'
  - '!playwright.config.{js,ts,mjs,cjs}'
  - '!{components.json,scripts/**}'
asarUnpack:
  - resources/**
win:
  executableName: devhub
nsis:
  artifactName: devhub-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  executableName: devhub
  # Install devhub.desktop to match desktopName, which Electron uses as app_id / WM_CLASS.
  syncDesktopName: true
  maintainer: devhub
  category: Development
appImage:
  artifactName: devhub-${version}.${ext}
deb:
  packageName: devhub
  artifactName: devhub_${version}_${arch}.${ext}
npmRebuild: false
# Where the installed app looks for updates (ADR 0009). The release workflow builds with
# --publish never and uploads the installers itself, including the latest*.yml files written
# because of this setting.
publish:
  provider: github
  owner: Delta1035
  repo: devhub
  releaseType: release
