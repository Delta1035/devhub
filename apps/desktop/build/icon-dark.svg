<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="darkBgGrad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#181F2A"/>
      <stop offset="100%" stop-color="#080A0D"/>
    </radialGradient>
    <linearGradient id="boltGradDark" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4EEDB0"/>
      <stop offset="100%" stop-color="#28BE83"/>
    </linearGradient>
    <linearGradient id="braceGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- Dark squircle background with depth -->
  <rect width="512" height="512" rx="112" fill="url(#darkBgGrad)"/>
  <!-- Subtle border highlights for dark environments -->
