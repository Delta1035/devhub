  <g fill="none" stroke="url(#braceGradDark)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path id="brace" d="M168 120 Q120 120 120 168 V216 Q120 256 80 256 Q120 256 120 296 V344 Q120 392 168 392"/>
